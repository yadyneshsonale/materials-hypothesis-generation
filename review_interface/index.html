<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MatHG Evidence Review</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">MatHG evidence review</p>
      <h1>Paper, roles, and decision questions</h1>
    </div>
    <label class="paper-picker">
      <span>Research paper</span>
      <select id="paperSelect" aria-label="Select research paper"></select>
    </label>
  </header>

  <section class="paper-summary">
    <div>
      <h2 id="paperTitle">Loading papers…</h2>
      <p id="paperMeta"></p>
    </div>
    <p class="pdf-notice" id="pdfNotice"></p>
  </section>

  <main class="workspace">
    <section class="pdf-pane" aria-label="PDF visual review">
      <div class="pane-header">
        <div>
          <span class="pane-kicker">Visual source</span>
          <strong id="pdfPageLabel">PDF</strong>
        </div>
        <a id="openPdf" target="_blank" rel="noopener">Open PDF</a>
      </div>
      <iframe id="pdfViewer" title="Research paper PDF"></iframe>
    </section>

    <section class="review-pane" aria-label="Generated roles and questions">
      <div class="tabs" role="tablist">
        <button class="tab active" id="rolesTab" data-panel="rolesPanel" role="tab">Roles <span id="roleCount"></span></button>
        <button class="tab" id="questionsTab" data-panel="questionsPanel" role="tab">Questions <span id="questionCount"></span></button>
      </div>

      <div class="filters" id="roleFilters"></div>
      <div class="cards" id="rolesPanel" role="tabpanel"></div>
      <div class="cards hidden" id="questionsPanel" role="tabpanel"></div>

      <aside class="evidence-drawer" id="evidenceDrawer" aria-live="polite">
        <div class="drawer-header">
          <div>
            <span class="pane-kicker">Exact XML-derived evidence</span>
            <h3 id="evidenceTitle">Select a role or question</h3>
          </div>
          <button id="closeEvidence" aria-label="Close evidence">×</button>
        </div>
        <div id="evidenceBody" class="evidence-body">
          The matching chunk will appear here with the evidence span highlighted.
        </div>
      </aside>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
